<body>

    <div id="top">
        <div id="include-headermenu"></div>

        <h1>文字列のハッシュ、エンコード変換</h1>

        <p><a href="https://oasis3855.github.io/webpage/">Home</a> &gt; <a
                href="https://oasis3855.github.io/webpage/software/">Software</a> &gt; This page </p>

        <p style="text-align: right;">Last Update <span id="lastedit-date"></span></p>

        <p><label for="text_input">入力文字列（最大100文字）</label>
            <input type="text" name="" id="text_input" size="50" maxlength="100" />
            <input type="button" value="変換" onclick="onPressButtonConvert()">
        </p>

        <table class="noborder">
            <tr>
                <td>入力文字列</td>
                <td></td>
                <td id="input_string"></td>
            </tr>
            <tr>
                <td>文字列の長さ</td>
                <td></td>
                <td id="length"></td>
            </tr>
            <tr>
                <td>HEX</td>
                <td></td>
                <td id="hex"></td>
            </tr>
            <tr>
                <td>MD5</td>
                <td><input type="checkbox" name="" id="md5" checked /></td>
                <td id="md5"></td>
            </tr>
            <tr>
                <td>SHA-1</td>
                <td><input type="checkbox" name="" id="sha-1" checked /></td>
                <td id="sha-1"></td>
            </tr>
            <tr>
                <td>SHA-256</td>
                <td><input type="checkbox" name="" id="sha-256" checked /></td>
                <td id="sha-256"></td>
            </tr>
            <tr>
                <td>urlencode(component)</td>
                <td><input type="checkbox" name="" id="urlencode_component" checked /></td>
                <td id="urlencode_component"></td>
            </tr>
            <tr>
                <td>urlencode</td>
                <td><input type="checkbox" name="" id="urlencode" checked /></td>
                <td id="urlencode"></td>
            </tr>
            <tr>
                <td>urldecode</td>
                <td><input type="checkbox" name="" id="urldecode" /></td>
                <td id="urldecode"></td>
            </tr>
            <tr>
                <td>base64</td>
                <td><input type="checkbox" name="" id="base64" checked /></td>
                <td id="base64"></td>
            </tr>
            <tr>
                <td>base64decode</td>
                <td><input type="checkbox" name="" id="base64decode" /></td>
                <td id="base64decode"></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>

        <p>&nbsp;</p>
        <div id="include-footermenu"></div>

    </div>
